[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biomed-parity"
dynamic = ["version"]
description = "Native Python implementations and R reference checks for biomedical statistics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "xiangjiawei1234-prog" }]
keywords = [
    "biostatistics",
    "statistics",
    "survival-analysis",
    "competing-risks",
    "roc-analysis",
    "clinical-trials",
    "epidemiology",
    "reproducibility",
    "r-migration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/xiangjiawei1234-prog/biomed-parity"
Repository = "https://github.com/xiangjiawei1234-prog/biomed-parity"
PyPI = "https://pypi.org/project/biomed-parity/"
Issues = "https://github.com/xiangjiawei1234-prog/biomed-parity/issues"
Changelog = "https://github.com/xiangjiawei1234-prog/biomed-parity/releases"

[tool.setuptools.dynamic]
version = { attr = "biomed_parity.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
